name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m compileall -q src tests scripts
      - run: python -m assistant_hub doctor
        env:
          PYTHONPATH: src
      - run: python scripts/check_public_tree.py

  ui-check:
    name: offline UI check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for module in web/*.mjs web/tests/*.mjs src/assistant_hub/local_web/*.mjs; do
            node --check "$module"
          done
      - run: node --test web/tests/*.test.mjs
