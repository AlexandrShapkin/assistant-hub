name: synthetic UI preview
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: assistant-hub-synthetic-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: deploy synthetic-only preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview modules and synthetic-only boundaries
        run: |
          set -eu
          for module in web/app.mjs web/view-model.mjs web/demo-data.mjs web/i18n.mjs web/tests/view-model.test.mjs web/tests/i18n.test.mjs; do
            node --check "$module"
          done
          node --test web/tests/*.test.mjs
          python3 scripts/check_public_tree.py
      - name: Build explicit static allowlist
        run: |
          mkdir -p _site
          cp web/index.html web/styles.css web/app.mjs web/view-model.mjs web/demo-data.mjs web/i18n.mjs web/README.md _site/
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
