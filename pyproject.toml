[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-hub"
version = "0.1.0"
description = "Provider-independent, local pre-alpha assistant scaffold"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
assistant-hub = "assistant_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
